name: publish-character-sheet
on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-character-sheet:
    name: build-character-sheet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: npm install playwright pdf-lib
      - run: npx playwright install --with-deps chromium
      # index.html -> form-fillable character-sheet.pdf + one PNG preview per page
      # (character-sheet-page-1.png, -2, -3)
      - run: node scripts/render.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: character-sheet
          path: |
            character-sheet.pdf
            character-sheet-page-*.png
      - name: Publish release
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest --target master --latest \
            --title "$(date '+%Y-%m-%dT%H:%M:%S')" --notes "" \
            character-sheet.pdf character-sheet-page-*.png
        env:
          GH_TOKEN: ${{ github.token }}
